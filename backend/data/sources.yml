# Sources configuration for Seeker Bot
# Content sources for Russian cultural events and news
#
# Priority levels:
#   2 = high (every 30 min) — city event afisha (gorodskoyportal)
#   1 = normal (every 60 min) — cultural news / music
#   0 = low (every 2 hours) — general city news
#
# Проверено 2026-08: ленты живые, отдают RSS/XML.
# Многие прежние источники (KudaGo RSS, Culture.ru, музеи) закрыли RSS —
# события крупнейших афиш доступны через gorodskoyportal.ru/<city>/afisha/rss/.
# СПб/Нижний Новгород RSS-афиш не имеют — покрываются общими культурными новостями
# (KudaGo public API планируется отдельным API-адаптером).

sources:
  # --- Городские афиши (gorodskoyportal, windows-1251) ---
  - name: "Афиша Москва"
    slug: "afisha-moskva"
    source_type: rss
    feed_url: "https://gorodskoyportal.ru/moskva/afisha/rss/"
    priority: 2
    default_city_slug: moscow
    fetch_interval_minutes: 30
    timeout_seconds: 30

  - name: "Афиша Казань"
    slug: "afisha-kazan"
    source_type: rss
