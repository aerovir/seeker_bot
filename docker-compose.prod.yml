version: "3.9"

services:
  bot:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: seeker-bot
    env_file:
      - .env
    environment:
      - LOG_DIR=/var/log/seeker_bot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m src.bot.main
    restart: unless-stopped
    volumes:
      - seeker_bot_logs:/var/log/seeker_bot

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: seeker-api
    env_file:
      - .env
    environment:
      - LOG_DIR=/var/log/seeker_bot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000 --workers 4
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - seeker_bot_logs:/var/log/seeker_bot
    healthcheck:
      # curl отсутствует в python:3.12-slim — проверяем через urllib
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: seeker-celery-worker
    env_file:
      - .env
    environment:
      - LOG_DIR=/var/log/seeker_bot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # --pool=solo: асинхронные задачи используют asyncio.run() со своим loop;
    # prefork-пул разбивает соединения asyncpg по разным loop → "attached to a different loop"
    command: celery -A celery_app.celery worker -l info -Q high_priority,default,notifications,maintenance --pool=solo
    restart: unless-stopped
    volumes:
      - seeker_bot_logs:/var/log/seeker_bot

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: seeker-celery-beat
    env_file:
      - .env
    environment:
      - LOG_DIR=/var/log/seeker_bot
    depends_on:
      - redis
      - postgres
    command: celery -A celery_app.celery beat -l info
    restart: unless-stopped
    volumes:
      - seeker_bot_logs:/var/log/seeker_bot

  postgres:
    image: postgres:16-alpine
    container_name: seeker-postgres
    environment:
      POSTGRES_DB: seeker_bot
      POSTGRES_USER: seeker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-seeker_prod_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seeker -d seeker_bot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    # Production: use managed PostgreSQL instead of container

  redis:
    image: redis:7-alpine
    container_name: seeker-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
  redis_data:
  seeker_bot_logs:
